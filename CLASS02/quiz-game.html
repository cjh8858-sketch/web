<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상식 퀴즈 게임</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
            min-height: 500px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Home Screen */
        .home-screen h1 {
            font-size: 2.5em;
            color: #667eea;
            margin-bottom: 10px;
            text-align: center;
        }

        .home-screen p {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f4ff;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        .btn-small {
            padding: 10px 20px;
            font-size: 0.9em;
        }

        .btn-disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Game Setup Screen */
        .setup-screen {
            max-width: 500px;
            margin: 0 auto;
        }

        .setup-screen h2 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
            font-size: 1.8em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            font-size: 1.05em;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .mode-selection {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .mode-option {
            flex: 1;
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }

        .mode-option.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .mode-option h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .mode-option p {
            color: #666;
            font-size: 0.9em;
        }

        /* Game Screen */
        .game-screen {
            max-width: 700px;
            margin: 0 auto;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .progress-info {
            font-size: 1.1em;
            color: #333;
            font-weight: 600;
        }

        .score-display {
            font-size: 1.3em;
            color: #667eea;
            font-weight: 700;
        }

        .timer {
            font-size: 1.2em;
            font-weight: 700;
            padding: 10px 15px;
            border-radius: 8px;
            background: #f0f4ff;
            color: #667eea;
        }

        .timer.warning {
            background: #fff3cd;
            color: #ff9800;
        }

        .timer.critical {
            background: #ffebee;
            color: #f44336;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }

        .category-badge {
            display: inline-block;
            padding: 6px 12px;
            background: #f0f4ff;
            color: #667eea;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .question {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 30px;
            line-height: 1.5;
            font-weight: 500;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .option-btn {
            padding: 20px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            font-size: 1em;
            min-height: 70px;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(.disabled) {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .option-btn.correct {
            border-color: #4caf50;
            background: #f1f8f4;
            color: #4caf50;
        }

        .option-btn.incorrect {
            border-color: #f44336;
            background: #fef5f5;
            color: #f44336;
        }

        .option-btn.disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .feedback {
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            display: none;
        }

        .feedback.show {
            display: block;
            animation: slideIn 0.3s ease-in;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback-correct {
            background: #f1f8f4;
            color: #4caf50;
            border-left: 4px solid #4caf50;
        }

        .feedback-incorrect {
            background: #fef5f5;
            color: #f44336;
            border-left: 4px solid #f44336;
        }

        .explanation {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: normal;
            color: #666;
        }

        .game-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn-hint {
            background: #ffc107;
            color: white;
            padding: 10px 20px;
            font-size: 0.9em;
        }

        .btn-pause {
            background: #2196f3;
            color: white;
            padding: 10px 20px;
            font-size: 0.9em;
        }

        .hint-count {
            display: inline-block;
            margin-left: 5px;
            background: rgba(255, 255, 255, 0.3);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.85em;
        }

        /* Pause Screen */
        .pause-screen {
            text-align: center;
            max-width: 400px;
            margin: 0 auto;
        }

        .pause-screen h2 {
            font-size: 2em;
            color: #667eea;
            margin-bottom: 30px;
        }

        .pause-screen p {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 30px;
        }

        /* Result Screen */
        .result-screen {
            max-width: 600px;
            margin: 0 auto;
        }

        .result-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .final-score {
            font-size: 3em;
            color: #667eea;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .grade {
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            padding: 20px;
            background: #f0f4ff;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #e0e0ff;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
        }

        .category-scores {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .category-scores h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .category-score {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .category-score:last-child {
            border-bottom: none;
        }

        .category-name {
            color: #667eea;
            font-weight: 600;
        }

        .category-points {
            color: #333;
            font-weight: 700;
        }

        .share-button {
            background: #667eea;
            color: white;
            width: 100%;
            margin-bottom: 15px;
        }

        /* Dashboard Screen */
        .dashboard-screen {
            max-width: 700px;
            margin: 0 auto;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .dashboard-header h2 {
            font-size: 2em;
            color: #667eea;
            margin-bottom: 10px;
        }

        .stats-section {
            margin-bottom: 40px;
        }

        .stats-section h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.2em;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }

        .personal-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card-value {
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-card-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        .leaderboard-table th,
        .leaderboard-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .leaderboard-table th {
            background: #f0f4ff;
            color: #667eea;
            font-weight: 600;
        }

        .rank-medal {
            font-size: 1.2em;
            margin-right: 5px;
        }

        .leaderboard-table tr:nth-child(odd) {
            background: #fafbff;
        }

        .game-history {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 20px;
        }

        .history-item {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-info {
            flex: 1;
        }

        .history-name {
            font-weight: 600;
            color: #333;
        }

        .history-detail {
            font-size: 0.85em;
            color: #999;
            margin-top: 3px;
        }

        .history-score {
            font-size: 1.2em;
            font-weight: 700;
            color: #667eea;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .home-screen h1 {
                font-size: 1.8em;
            }

            .options {
                grid-template-columns: 1fr;
            }

            .game-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .personal-stats {
                grid-template-columns: 1fr;
            }

            .mode-selection {
                flex-direction: column;
            }

            .game-controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .leaderboard-table {
                font-size: 0.9em;
            }

            .leaderboard-table th,
            .leaderboard-table td {
                padding: 8px;
            }
        }

        .empty-message {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Home Screen -->
        <div id="homeScreen" class="screen active">
            <h1>🎮 상식 퀴즈 게임</h1>
            <p>당신의 상식 수준을 테스트해보세요!</p>
            <div class="button-group">
                <button class="btn-primary" onclick="goToSetup()">게임 시작</button>
                <button class="btn-secondary" onclick="goToDashboard()">📊 통계 보기</button>
            </div>
        </div>

        <!-- Game Setup Screen -->
        <div id="setupScreen" class="screen">
            <div class="setup-screen">
                <h2>게임 준비</h2>
                <div class="form-group">
                    <label for="nickname">닉네임 (1-15자)</label>
                    <input type="text" id="nickname" maxlength="15" placeholder="닉네임을 입력하세요">
                </div>

                <div class="form-group">
                    <label>게임 모드 선택</label>
                    <div class="mode-selection">
                        <div class="mode-option selected" onclick="selectMode('full')">
                            <h3>🎯 전체 도전</h3>
                            <p>40문제 | 제한시간 없음</p>
                        </div>
                        <div class="mode-option" onclick="selectMode('speed')">
                            <h3>⚡ 스피드 퀴즈</h3>
                            <p>20문제 | 15초/문제</p>
                        </div>
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn-primary" onclick="startGame()">게임 시작</button>
                    <button class="btn-secondary" onclick="goToHome()">돌아가기</button>
                </div>
            </div>
        </div>

        <!-- Pause Screen -->
        <div id="pauseScreen" class="screen">
            <div class="pause-screen">
                <h2>⏸ 일시정지</h2>
                <p>게임이 일시정지되었습니다.</p>
                <div class="button-group">
                    <button class="btn-primary" onclick="resumeGame()">게임 재개</button>
                    <button class="btn-secondary" onclick="goToHome()">홈으로</button>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="screen">
            <div class="game-screen">
                <div class="game-header">
                    <div class="progress-info">
                        문제 <span id="currentQuestion">1</span> / <span id="totalQuestions">40</span>
                    </div>
                    <div class="score-display">점수: <span id="currentScore">0</span></div>
                    <div class="timer" id="timer"></div>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>

                <div class="category-badge" id="categoryBadge"></div>

                <div class="question" id="question"></div>

                <div class="feedback" id="feedback"></div>

                <div class="options" id="options"></div>

                <div class="game-controls">
                    <button class="btn-hint" id="hintBtn" onclick="useHint()">💡 힌트 <span class="hint-count" id="hintCount">3</span></button>
                    <button class="btn-pause" onclick="pauseGame()">⏸ 일시정지</button>
                </div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="resultScreen" class="screen">
            <div class="result-screen">
                <div class="result-header">
                    <div class="final-score" id="finalScore">0</div>
                    <div class="grade" id="grade"></div>
                </div>

                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-value" id="correctRate">0%</div>
                        <div class="stat-label">정답률</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="maxCombo">0</div>
                        <div class="stat-label">최대 연속정답</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="avgTime">0초</div>
                        <div class="stat-label">평균 응답시간</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="solvedCount">0</div>
                        <div class="stat-label">푼 문제</div>
                    </div>
                </div>

                <div class="category-scores">
                    <h3>카테고리별 점수</h3>
                    <div id="categoryScores"></div>
                </div>

                <div class="button-group">
                    <button class="share-button btn-primary" onclick="shareResult()">📋 결과 복사하기</button>
                    <button class="btn-primary" onclick="goToSetup()">다시 하기</button>
                    <button class="btn-secondary" onclick="goToDashboard()">통계 보기</button>
                    <button class="btn-secondary" onclick="goToHome()">홈으로</button>
                </div>
            </div>
        </div>

        <!-- Dashboard Screen -->
        <div id="dashboardScreen" class="screen">
            <div class="dashboard-screen">
                <div class="dashboard-header">
                    <h2>📊 게임 통계</h2>
                </div>

                <div class="stats-section">
                    <h3>개인 통계</h3>
                    <div class="personal-stats">
                        <div class="stat-card">
                            <div class="stat-card-value" id="totalGames">0</div>
                            <div class="stat-card-label">총 플레이</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-value" id="bestScore">0</div>
                            <div class="stat-card-label">최고 점수</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-value" id="avgScore">0</div>
                            <div class="stat-card-label">평균 점수</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-value" id="winRate">0%</div>
                            <div class="stat-card-label">승률</div>
                        </div>
                    </div>
                </div>

                <div class="stats-section">
                    <h3>상위 10명 순위</h3>
                    <table class="leaderboard-table">
                        <thead>
                            <tr>
                                <th>순위</th>
                                <th>닉네임</th>
                                <th>점수</th>
                                <th>날짜</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboardBody"></tbody>
                    </table>
                </div>

                <div class="stats-section">
                    <h3>최근 게임 기록</h3>
                    <div class="game-history" id="gameHistory"></div>
                </div>

                <div class="button-group">
                    <button class="btn-primary" onclick="goToHome()">홈으로</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const QUIZ_DATA = [
            // 한국사
            {
                category: "한국사",
                question: "조선왕조가 건국된 연도는?",
                options: ["1392년", "1376년", "1388년", "1400년"],
                correct: 0,
                explanation: "이성계가 1392년에 조선을 건국했습니다."
            },
            {
                category: "한국사",
                question: "임진왜란이 일어난 연도는?",
                options: ["1555년", "1592년", "1603년", "1610년"],
                correct: 3,
                explanation: "도요토미 히데요시가 1592년에 도발한 임진왜란입니다."
            },
            {
                category: "한국사",
                question: "세종대왕이 만든 문자는?",
                options: ["부경문", "이두", "한글", "훈민정음"],
                correct: 2,
                explanation: "훈민정음(한글)은 세종대왕이 1443년에 만든 한국의 고유한 문자입니다."
            },
            {
                category: "한국사",
                question: "삼국통일을 이룬 국가는?",
                options: ["백제", "신라", "고구려", "가야"],
                correct: 1,
                explanation: "신라의 문무왕이 676년에 삼국통일을 완성했습니다."
            },
            {
                category: "한국사",
                question: "고려를 건국한 인물은?",
                options: ["왕건", "궁예", "견훤", "신문왕"],
                correct: 0,
                explanation: "왕건이 918년에 고려를 건국했습니다."
            },
            {
                category: "한국사",
                question: "한글날은 몇 월 며칠?",
                options: ["10월 9일", "8월 15일", "3월 1일", "7월 27일"],
                correct: 0,
                explanation: "한글날은 10월 9일로, 훈민정음 반포를 기념하는 날입니다."
            },

        let currentQuestionIndex = 0;

        let questionStartTime = 0;
        let correctAnswers = 0;
        let currentCombo = 0;
        let maxCombo = 0;
        let categoryScores = {};
        let timerInterval = null;
        let timeRemaining = 0;
        let gamePaused = false;
        let gameQuestions = [];

        function goToHome() {
            showScreen('homeScreen');
            resetGame();
        }

        function goToSetup() {
            showScreen('setupScreen');
            document.getElementById('nickname').value = '';
            selectMode('full');
        }

        function goToDashboard() {
            showScreen('dashboardScreen');
            loadDashboard();
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function selectMode(mode) {
            gameMode = mode;
            document.querySelectorAll('.mode-option').forEach(opt => opt.classList.remove('selected'));
            event.target.closest('.mode-option').classList.add('selected');
        }

        function startGame() {
            const nicknameInput = document.getElementById('nickname').value.trim();
            if (!nicknameInput) {
                alert('닉네임을 입력해주세요!');
                return;
            }
            nickname = nicknameInput;
            currentQuestionIndex = 0;
            score = 0;
            hintsRemaining = 3;
            correctAnswers = 0;
            currentCombo = 0;
            maxCombo = 0;
            categoryScores = {};
            gamePaused = false;
            hintedAnswers = [];

            gameQuestions = gameMode === 'full'
                ? QUIZ_DATA.slice()
                : shuffleArray(QUIZ_DATA).slice(0, 20);

            const questionCount = gameQuestions.length;
            document.getElementById('totalQuestions').textContent = questionCount;

            gameActive = true;
            showScreen('gameScreen');
            showQuestion();
        }

        function showQuestion() {
            if (currentQuestionIndex >= gameQuestions.length) {
                endGame();
                return;
            }

            const question = gameQuestions[currentQuestionIndex];
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            document.getElementById('categoryBadge').textContent = '🏷️ ' + question.category;
            document.getElementById('question').textContent = question.question;

            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            hintedAnswers = [];

            const indices = [0, 1, 2, 3];
            indices.forEach(i => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = String.fromCharCode(65 + i) + '. ' + question.options[i];
                btn.onclick = () => selectAnswer(i, btn);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('feedback').classList.remove('show', 'feedback-correct', 'feedback-incorrect');
            document.getElementById('hintBtn').disabled = false;
            document.getElementById('hintBtn').className = 'btn-hint';
            document.getElementById('hintCount').textContent = hintsRemaining;

            questionStartTime = Date.now();

            if (gameMode === 'speed') {
                timeRemaining = 15;
                updateTimer();
                clearInterval(timerInterval);
                timerInterval = setInterval(updateTimer, 100);
            } else {
                document.getElementById('timer').innerHTML = '';
            }

            updateProgress();
        }

        function updateTimer() {
            if (gamePaused) return;

            timeRemaining -= 0.1;
            const timerEl = document.getElementById('timer');

            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                selectAnswer(-1);
                return;
            }

            timerEl.textContent = '⏱️ ' + timeRemaining.toFixed(1) + '초';
            timerEl.classList.remove('warning', 'critical');

            if (timeRemaining <= 5) {
                timerEl.classList.add('critical');
            } else if (timeRemaining <= 10) {
                timerEl.classList.add('warning');
            }
        }

        function selectAnswer(optionIndex, btn) {
            if (!gameActive || gamePaused) return;

            const question = gameQuestions[currentQuestionIndex];
            const isCorrect = optionIndex === question.correct;
            const timeTaken = (Date.now() - questionStartTime) / 1000;
            totalTime += timeTaken;

            clearInterval(timerInterval);

            const optionBtns = document.querySelectorAll('.option-btn');
            optionBtns.forEach((b, i) => {
                b.disabled = true;
                if (i === question.correct) {
                    b.classList.add('correct');
                } else if (i === optionIndex && !isCorrect) {
                    b.classList.add('incorrect');
                }
            });

            const feedback = document.getElementById('feedback');
            feedback.classList.add('show');

            if (isCorrect) {
                let points = 10;
                currentCombo++;
                correctAnswers++;

                if (timeTaken < 10) points += 3;
                if (hintsRemaining === 3) points += 2;
                if (currentCombo >= 3) points += Math.min(10, currentCombo);

                maxCombo = Math.max(maxCombo, currentCombo);
                score += points;

                feedback.textContent = `✓ 정답입니다! +${points}점`;
                feedback.classList.add('feedback-correct');
            } else {
                currentCombo = 0;
                feedback.textContent = '✗ 틀렸습니다!';
                feedback.classList.add('feedback-incorrect');
            }

            feedback.innerHTML += `<div class="explanation">${question.explanation}</div>`;

            if (!categoryScores[question.category]) {
                categoryScores[question.category] = 0;
            }
            if (isCorrect) {
                categoryScores[question.category] += 10;
            }

            document.getElementById('currentScore').textContent = score;

            setTimeout(() => {
                currentQuestionIndex++;
                showQuestion();
            }, 2000);
        }

        function useHint() {
            if (hintsRemaining <= 0) return;

            const question = gameQuestions[currentQuestionIndex];
            const optionBtns = document.querySelectorAll('.option-btn');
            const wrongIndices = [0, 1, 2, 3].filter(i => i !== question.correct);

            let removed = 0;
            for (let i of wrongIndices) {
                if (removed >= 2) break;
                if (hintedAnswers.includes(i)) continue;

                optionBtns[i].style.opacity = '0.3';
                optionBtns[i].style.textDecoration = 'line-through';
                hintedAnswers.push(i);
                removed++;
            }

            hintsRemaining--;
            document.getElementById('hintCount').textContent = hintsRemaining;
            if (hintsRemaining === 0) {
                document.getElementById('hintBtn').disabled = true;
                document.getElementById('hintBtn').classList.add('btn-disabled');
            }
        }

        function pauseGame() {
            gamePaused = true;
            clearInterval(timerInterval);
            showScreen('pauseScreen');
        }

        function resumeGame() {
            gamePaused = false;
            showScreen('gameScreen');
            if (gameMode === 'speed') {
                timerInterval = setInterval(updateTimer, 100);
            }
        }

        function updateProgress() {
            const progress = (currentQuestionIndex / gameQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);

            const totalQuestions = gameQuestions.length;
            const correctRate = Math.round((correctAnswers / totalQuestions) * 100);
            const avgTime = totalQuestions > 0 ? (totalTime / totalQuestions).toFixed(1) : 0;

            let grade = '도전자';
            let gradeEmoji = '';
            if (score >= 360) {
                grade = '상급자';
                gradeEmoji = '⭐⭐⭐';
            } else if (score >= 280) {
                grade = '중급자';
                gradeEmoji = '⭐⭐';
            } else if (score >= 200) {
                grade = '초급자';
                gradeEmoji = '⭐';
            }

            document.getElementById('finalScore').textContent = score;
            document.getElementById('grade').textContent = `${gradeEmoji} ${grade}`;
            document.getElementById('correctRate').textContent = correctRate + '%';
            document.getElementById('maxCombo').textContent = maxCombo;
            document.getElementById('avgTime').textContent = avgTime + '초';
            document.getElementById('solvedCount').textContent = correctAnswers + '/' + totalQuestions;

            const categoryScoresHtml = Object.entries(categoryScores)
                .map(([cat, pts]) => `<div class="category-score"><span class="category-name">${cat}</span><span class="category-points">${pts}점</span></div>`)
                .join('');
            document.getElementById('categoryScores').innerHTML = categoryScoresHtml;

            saveGameResult({
                nickname: nickname,
                score: score,
                mode: gameMode,
                date: new Date().toLocaleDateString('ko-KR'),
                correctRate: correctRate,
                maxCombo: maxCombo,
                avgTime: parseFloat(avgTime)
            });

            showScreen('resultScreen');
        }

        function saveGameResult(result) {
            let results = JSON.parse(localStorage.getItem('quizGameResults') || '[]');
            results.push(result);
            results.sort((a, b) => b.score - a.score);
            localStorage.setItem('quizGameResults', JSON.stringify(results));
        }

        function loadDashboard() {
            const results = JSON.parse(localStorage.getItem('quizGameResults') || '[]');

            if (results.length === 0) {
                document.getElementById('totalGames').textContent = '0';
                document.getElementById('bestScore').textContent = '0';
                document.getElementById('avgScore').textContent = '0';
                document.getElementById('winRate').textContent = '0%';
                document.getElementById('leaderboardBody').innerHTML = '<tr><td colspan="4" class="empty-message">아직 게임 기록이 없습니다.</td></tr>';
                document.getElementById('gameHistory').innerHTML = '<div class="empty-message">게임 기록이 없습니다.</div>';
                return;
            }

            const totalGames = results.length;
            const bestScore = results[0].score;
            const avgScore = Math.round(results.reduce((sum, r) => sum + r.score, 0) / totalGames);
            const winRate = Math.round((results.filter(r => r.score >= 200).length / totalGames) * 100);

            document.getElementById('totalGames').textContent = totalGames;
            document.getElementById('bestScore').textContent = bestScore;
            document.getElementById('avgScore').textContent = avgScore;
            document.getElementById('winRate').textContent = winRate + '%';

            const topResults = results.slice(0, 10);
            const leaderboardHtml = topResults.map((r, i) => {
                const medals = ['🥇', '🥈', '🥉'];
                const medal = medals[i] || '';
                return `<tr>
                    <td>${medal} ${i + 1}</td>
                    <td>${r.nickname}</td>
                    <td><strong>${r.score}</strong></td>
                    <td>${r.date}</td>
                </tr>`;
            }).join('');
            document.getElementById('leaderboardBody').innerHTML = leaderboardHtml;

            const recentResults = results.slice(0, 10);
            const historyHtml = recentResults.map(r => `<div class="history-item">
                <div class="history-info">
                    <div class="history-name">${r.nickname}</div>
                    <div class="history-detail">${r.date} • ${r.mode === 'full' ? '전체 도전' : '스피드 퀴즈'}</div>
                </div>
                <div class="history-score">${r.score}</div>
            </div>`).join('');
            document.getElementById('gameHistory').innerHTML = historyHtml || '<div class="empty-message">게임 기록이 없습니다.</div>';
        }

        function shareResult() {
            const text = `🎮 상식 퀴즈 게임 결과
닉네임: ${nickname}
점수: ${score}점
정답률: ${document.getElementById('correctRate').textContent}
등급: ${document.getElementById('grade').textContent}
모드: ${gameMode === 'full' ? '전체 도전(40문제)' : '스피드 퀴즈(20문제)'}
날짜: ${new Date().toLocaleDateString('ko-KR')}

상식 퀴즈 게임에서 당신의 실력을 뽐내보세요! 🎯`;

            navigator.clipboard.writeText(text).then(() => {
                alert('결과가 클립보드에 복사되었습니다!');
            });
        }

        function shuffleArray(arr) {
            const newArr = [...arr];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        function resetGame() {
            gameActive = false;
            currentQuestionIndex = 0;
            score = 0;
            clearInterval(timerInterval);
        }
    </script>
</body>
</html>
